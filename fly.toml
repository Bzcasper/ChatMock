app = "chatmock"
primary_region = "ord"

[build]
dockerfile = "Dockerfile"

[env]
VERBOSE = "false"
VERBOSE_OBFUSCATION = "false"
CHATGPT_TOKEN_REFRESH_TIMEOUT = "30"
CHATGPT_TOKEN_REFRESH_MAX_RETRIES = "3"
PYTHONUNBUFFERED = "1"

[processes]
app = "chatmock serve --host 0.0.0.0 --port 8080"

[[services]]
protocol = "tcp"
internal_port = 8080
processes = ["app"]
auto_stop_machines = false
auto_start_machines = true
min_machines_running = 1

[[services.ports]]
port = 80
handlers = ["http"]

[[services.ports]]
port = 443
handlers = ["tls", "http"]

[services.http_checks]
interval = 10000
timeout = 5000
grace_period = 5000
method = "GET"
path = "/health"

[mounts]
source = "chatmock_data"
destination = "/app/data"

[[checks]]
type = "http"
grace_period = "30s"
interval = "30s"
method = "GET"
path = "/health/tokens"
timeout = "5s"
